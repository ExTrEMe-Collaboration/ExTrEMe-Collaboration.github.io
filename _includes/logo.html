{%- comment -%}
  Collaboration mark: two Lorentz-contracted nuclei around a hot fireball.
  Pass a unique `id` when the mark appears more than once on a page.
{%- endcomment -%}
{%- assign gid = include.id | default: "logo" | prepend: "fireball-" -%}
<svg class="logo-mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="{{ gid }}" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.28" stop-color="#fcd34d"/>
      <stop offset="0.6" stop-color="#f97316"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="20" cy="20" rx="13" ry="10.5" fill="url(#{{ gid }})"/>
  <ellipse cx="6.5" cy="20" rx="2.6" ry="15" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <ellipse cx="33.5" cy="20" rx="2.6" ry="15" fill="none" stroke="currentColor" stroke-width="1.8"/>
</svg>
