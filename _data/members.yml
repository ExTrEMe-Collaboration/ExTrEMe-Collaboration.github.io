# Collaboration roster, rendered on /members/.
#
# `name` is the canonical spelling used everywhere on the site: speakers in
# _data/talks.yml must match one of these names exactly to be linked.
#
# Fields per person:
#   name:        Canonical full name.
#   position:    Short position label (e.g. "Professor", "PhD student", "PhD 2023").
#   affiliation: Institution name, with acronym in parentheses.
#   country:     Country of the affiliation.
#   lattes:      (optional) Lattes CV link, https://lattes.cnpq.br/<16 digits>
#   orcid:       (optional) ORCID iD only, e.g. 0000-0002-4091-1779
#   inspire:     (optional) INSPIRE-HEP author profile link
#   url:         (optional) Personal or group web page
#   role:        (optional) Collaboration role, highlighted on the card.

