# Talks, seminars and posters by ExTrEMe members.
#
# One entry per presentation, newest first (the page sorts by `date` anyway).
# Conventions (enforced by scripts/check_data.py in CI):
#
#   date:      "YYYY-MM" (quoted). Year and month shown on the site are derived from it.
#   speaker:   Full name exactly as in _data/members.yml (current or alumni), so the
#              site can link it to the member card.
#   external:  (optional) true when the presenter is not in _data/members.yml
#              (e.g. an external collaborator presenting joint work); write "First Last".
#   type:      One of: Plenary talk | Invited talk | Talk | Flash talk | Seminar | Colloquium | Poster
#              ("Talk" = contributed or unspecified oral presentation.)
#   title:     Always double-quoted, original language and capitalisation.
#              Omit only if the title was never recorded.
#   event:     Official event name in its original language, with edition/year and a
#              common acronym in parentheses when there is one. For seminars and
#              colloquia: "<Series>, <Host institution>".
#   location:  "[Venue, ]City, [State, ]Country" — e.g. "UFF, Niterói, Brazil",
#              "Houston, TX, USA" — or "Online".
#   url:       (optional) Link specific to this talk: contribution page, slides, abstract.
#   event_url: (optional) Link to the event or seminar series as a whole.
#   video:     (optional) Recording.
#   coauthors: (optional) List of co-authors as "F. M. Lastname".

