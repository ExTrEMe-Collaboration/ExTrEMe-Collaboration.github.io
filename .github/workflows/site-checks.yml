name: Site Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  data-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate data files and conventions
        run: python scripts/check_data.py

  build-and-link-check:
    needs: data-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Jekyll (same builder as GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check internal links in the built site
        run: python3 scripts/check_links.py _site
